<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QR IMG</title>
        <link rel="stylesheet" href="style.css" />

        <style>
                body {
                        margin: 0;
                        padding: 0;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        height: 100vh;
                        background-color: #D5E1EF
                }

                .container {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                }

                .card {
                        width: 45%;
                        height: 126%;
                        padding: 16px 16px 40px 16px;
                        border-radius: 20px;
                        text-align: center;
                        background-color: white;
                }

                img {
                        width: 100%;
                }
        </style>
</head>

<body>
        <div class="container">
                <div class="card" style="text-align: center;">
                        <img src="./QR Image.png" height=auto alt="QR Code Image" style=" background-color: white" />
                        <h2 style=" background-color: white">Improve your front-end skills by building projects</h2>
                        <br />
                        <p style=" background-color: white">Scan the QR code to visit Frontend Mentor and take your
                                coding skills to the next
                                level</p>
                </div>
        </div>

</body>

</html>
